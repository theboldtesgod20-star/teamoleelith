    <!-- SCRIPT PARA MANEJAR LOS CLICS Y CONGELAR LOS GIFS -->
    <script>
        // Usamos "load" en lugar de "DOMContentLoaded" para asegurarnos de que la imagen 
        // ya descargó su primer frame antes de intentar dibujarlo en el canvas.
        window.addEventListener("load", () => {
            const meowSound = new Audio("boykiser-meow.mp3");
            const morseSound = new Audio("morse.wav");

            const boykissers = document.querySelectorAll('.boykisser');
            
            boykissers.forEach(gato => {
                // 1. Guardamos la ruta original (el GIF animado)
                const gifAnimado = gato.src;
                gato.setAttribute('data-animated', gifAnimado);

                // 2. Creamos un canvas para tomarle "foto" al primer frame y congelarlo
                const canvas = document.createElement('canvas');
                canvas.width = gato.naturalWidth || 60;
                canvas.height = gato.naturalHeight || 60;
                const ctx = canvas.getContext('2d');
                
                // Dibujamos el primer frame en el canvas
                ctx.drawImage(gato, 0, 0, canvas.width, canvas.height);
                
                try {
                    // Reemplazamos el src por la imagen congelada
                    gato.src = canvas.toDataURL('image/png');
                } catch(e) {
                    // Si el navegador bloquea el canvas por políticas estrictas locales (CORS), 
                    // simplemente se quedarán animados, pero el código no fallará.
                    console.warn("No se pudo congelar la imagen", e);
                }

                // 3. Al hacerle clic...
                gato.addEventListener('click', function() {
                    // Restauramos su animación original
                    this.src = this.getAttribute('data-animated');

                    // Reproducimos los sonidos correspondientes
                    if (this.alt.includes("mensaje subliminal")) {
                        morseSound.play();
                        
                        setTimeout(() => {
                            window.location.href = "https://www.mediafire.com/file/xs73crgrkwwj8bu/morse.wav/file";
                        }, 1000); 
                    } else {
                        let sonido = meowSound.cloneNode();
                        sonido.play();
                    }
                });
            });
        });
    </script>
